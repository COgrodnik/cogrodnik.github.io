<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Proyecto — Cristóbal Ogrodnik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,600;0,700;0,800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
html, body { width:100%; height:100%; overflow:hidden; font-family:'Montserrat',sans-serif; background:#000; color:#fff; }

/* ═══════════════════════════════════════════
   VIEWER — always full viewport
   Images fill the entire screen, UI overlays on top
═══════════════════════════════════════════ */
#viewer {
  position: fixed;
  inset: 0;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ─── SLIDES ─── */
.slide {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity .35s ease;
}
.slide.active { opacity: 1; z-index: 1; }

.slide img {
  /* Fill entire screen while maintaining aspect ratio */
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

/* ─── OVERLAY UI — hidden until mouse moves ─── */
#ui {
  position: fixed;
  inset: 0;
  z-index: 10;
  pointer-events: none;
  opacity: 0;
  transition: opacity .3s ease;
}
#ui.visible { opacity: 1; pointer-events: all; }

/* Top bar */
#topbar {
  position: absolute;
  top: 0; left: 0; right: 0;
  padding: 20px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: linear-gradient(to bottom, rgba(0,0,0,0.75) 0%, transparent 100%);
}

.proj-title {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.85);
}

.topbar-right { display:flex; gap:10px; }

.ui-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.25);
  color: #fff;
  font-family: 'Montserrat', sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.07em;
  padding: 8px 16px;
  border-radius: 4px;
  cursor: pointer;
  text-decoration: none;
  white-space: nowrap;
  transition: background .2s;
}
.ui-btn:hover { background: rgba(255,255,255,0.24); }
.ui-btn svg   { width:13px; height:13px; flex-shrink:0; }

/* Bottom bar */
#bottombar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 20px 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, transparent 100%);
}

.page-counter {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.2em;
  color: rgba(255,255,255,0.6);
}
.page-counter .cur { color: #fff; font-weight: 800; }

/* Nav arrows — left and right, with optional "siguiente" label */
.nav-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  background: none;
  border: none;
  color: #fff;
  padding: 12px;
  z-index: 12;
}
.nav-arrow.left  { left: 16px; }
.nav-arrow.right { right: 16px; }

.arrow-circle {
  width: 52px; height: 52px;
  border-radius: 50%;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.28);
  display: flex; align-items: center; justify-content: center;
  transition: background .2s, transform .15s;
}
.nav-arrow:hover .arrow-circle { background: rgba(255,255,255,0.25); transform: scale(1.06); }
.arrow-circle svg { width: 20px; height: 20px; }

.arrow-label {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.7);
  text-align: center;
  max-width: 80px;
  line-height: 1.3;
  opacity: 0;
  transition: opacity .3s ease;
}
.arrow-label.show { opacity: 1; }

/* ═══════════════════════════════════════════
   FLIP PROMPT (mobile portrait)
═══════════════════════════════════════════ */
#flip-prompt {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: #000;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 24px;
}

/* Show prompt only in portrait mobile */
@media (max-width:900px) and (orientation:portrait) {
  #flip-prompt { display: flex; }
  #viewer      { display: none; }
  #ui          { display: none; }
}

/* Phase 1: animation, phase 2: start button */
#flip-phase1 { display:flex; flex-direction:column; align-items:center; }
#flip-phase2 { display:none; flex-direction:column; align-items:center; gap:20px; }

.phone-anim {
  width: 64px; height: 106px;
  border: 3px solid rgba(255,255,255,0.9);
  border-radius: 10px;
  position: relative;
  margin-bottom: 32px;
  animation: doFlip 2s ease-in-out infinite;
}
.phone-anim::before { content:''; position:absolute; top:7px; left:50%; transform:translateX(-50%); width:24px; height:3px; background:rgba(255,255,255,0.35); border-radius:2px; }
.phone-anim::after  { content:''; position:absolute; bottom:6px; left:50%; transform:translateX(-50%); width:14px; height:14px; border:2px solid rgba(255,255,255,0.35); border-radius:50%; }

@keyframes doFlip {
  0%,30%  { transform: rotate(0deg); }
  70%,100%{ transform: rotate(-90deg); }
}

.flip-title { font-size:17px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:10px; }
.flip-msg   { font-size:12px; font-weight:300; color:rgba(255,255,255,0.55); line-height:1.7; max-width:250px; margin-bottom:28px; }

.start-btn {
  background: #fff;
  color: #000;
  border: none;
  padding: 14px 36px;
  font-family: 'Montserrat', sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  border-radius: 4px;
  cursor: pointer;
  transition: opacity .2s;
}
.start-btn:hover { opacity: .85; }

.skip-btn {
  background: none;
  border: 1px solid rgba(255,255,255,0.3);
  color: rgba(255,255,255,0.6);
  padding: 10px 24px;
  font-family: 'Montserrat', sans-serif;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.07em;
  border-radius: 4px;
  cursor: pointer;
}

/* In landscape: hide prompt, show viewer */
@media (max-width:900px) and (orientation:landscape) {
  #flip-prompt { display: none !important; }
  #viewer      { display: flex; }
  #ui          { display: block; }
}
</style>
</head>
<body>

<!-- FLIP PROMPT (portrait mobile) -->
<div id="flip-prompt">
  <!-- Phase 1: animation -->
  <div id="flip-phase1">
    <div class="phone-anim"></div>
    <h2 class="flip-title">Gira tu teléfono</h2>
    <p class="flip-msg">Para ver el proyecto, gira tu dispositivo a modo horizontal.</p>
  </div>
  <!-- Phase 2: start button (shown after rotation detected) -->
  <div id="flip-phase2">
    <h2 class="flip-title">¡Listo!</h2>
    <p class="flip-msg">Presiona comenzar para entrar al modo presentación.</p>
    <button class="start-btn" onclick="startPresentation()">Comenzar</button>
    <button class="skip-btn" onclick="skipToViewer()">Continuar sin rotar</button>
  </div>
</div>

<!-- VIEWER (fullscreen image display) -->
<div id="viewer">
  <!-- Slides injected by JS -->
</div>

<!-- UI OVERLAY (hidden until mouse/touch) -->
<div id="ui">
  <div id="topbar">
    <div class="proj-title" id="projTitle">PROYECTO</div>
    <div class="topbar-right">
      <!-- Exit fullscreen button (shown when in fullscreen) -->
      <button class="ui-btn" id="exitFsBtn" style="display:none" onclick="exitFS()">
        <svg viewBox="0 0 14 14" fill="none"><path d="M5 2H2v3M9 2h3v3M2 9v3h3M12 9v3h-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Salir de presentación
      </button>
      <!-- Enter fullscreen button (shown when NOT in fullscreen) -->
      <button class="ui-btn" id="enterFsBtn" onclick="enterFS()">
        <svg viewBox="0 0 14 14" fill="none"><path d="M2 5V2h3M9 2h3v3M2 9v3h3M12 9v3h-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Modo presentación
      </button>
      <a href="proyectos.html" class="ui-btn" id="closeBtn">
        <svg viewBox="0 0 12 12" fill="none"><path d="M2 2l8 8M2 10L10 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Cerrar
      </a>
    </div>
  </div>

  <!-- Left arrow -->
  <button class="nav-arrow left" id="prevBtn" onclick="prev()">
    <div class="arrow-circle">
      <svg viewBox="0 0 20 20" fill="none"><path d="M13 4L7 10L13 16" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <span class="arrow-label" id="prevLabel"></span>
  </button>

  <!-- Right arrow -->
  <button class="nav-arrow right" id="nextBtn" onclick="next()">
    <div class="arrow-circle">
      <svg viewBox="0 0 20 20" fill="none"><path d="M7 4L13 10L7 16" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <span class="arrow-label" id="nextLabel"></span>
  </button>

  <div id="bottombar">
    <div class="page-counter"><span class="cur" id="curPage">1</span> / <span id="totPage">1</span></div>
  </div>
</div>

<script>
/* ─── Project data ─── */
const PROJECTS = [
  { key:'muds',      title:'MUDS',                 slides:['proyectos-img/MUDS_1.jpg','proyectos-img/MUDS_2.jpg'] },
  { key:'neast',     title:'by Neast',              slides:['proyectos-img/Neast_1.jpg','proyectos-img/Neast_2.jpg'] },
  { key:'lontra',    title:'Lontra Platform',       slides:['proyectos-img/Lontra_Platform_01.jpg','proyectos-img/Lontra_Platform_02.jpg','proyectos-img/Lontra_Platform_03.jpg'] },
  { key:'konatec',   title:'Konatec',               slides:['proyectos-img/Konatec_01.jpg','proyectos-img/Konatec_02.jpg'] },
  { key:'copihue',   title:'Espacio Copihue',       slides:['proyectos-img/Espacio_Copihue_01.jpg','proyectos-img/Espacio_Copihue_02.jpg'] },
  { key:'cambridge', title:'Cambridge & José Cruz', slides:['proyectos-img/Cambridge_01.jpg','proyectos-img/Cambridge_03.jpg','proyectos-img/Cambridge_04.jpg'] },
  { key:'refugio',   title:'Refugio Prisma',        slides:['proyectos-img/Refugio_Prisma_01.jpg','proyectos-img/Refugio_Prisma_02.jpg'] }
];

const params    = new URLSearchParams(window.location.search);
const key       = params.get('p') || 'muds';
const projIdx   = PROJECTS.findIndex(p => p.key === key);
const project   = PROJECTS[Math.max(0, projIdx)];
const nextProj  = PROJECTS[projIdx + 1] || null;
const prevProj  = PROJECTS[projIdx - 1] || null;

document.getElementById('projTitle').textContent = project.title;
document.title = project.title + ' — Cristóbal Ogrodnik';
document.getElementById('totPage').textContent   = project.slides.length;

/* Build slides */
const viewer = document.getElementById('viewer');
project.slides.forEach((src, i) => {
  const div = document.createElement('div');
  div.className = 'slide' + (i === 0 ? ' active' : '');
  const img = document.createElement('img');
  img.src = src;
  img.alt = project.title + ' ' + (i + 1);
  div.appendChild(img);
  viewer.appendChild(div);
});

const allSlides = document.querySelectorAll('.slide');
const curPageEl = document.getElementById('curPage');
const nextLbl   = document.getElementById('nextLabel');
const prevLbl   = document.getElementById('prevLabel');
const prevBtn   = document.getElementById('prevBtn');
const nextBtn   = document.getElementById('nextBtn');
let current     = 0;

function showSlide(i) {
  allSlides.forEach((s, idx) => s.classList.toggle('active', idx === i));
  curPageEl.textContent = i + 1;

  // Next label: "Siguiente proyecto" on last slide if there's a next project
  if (i === allSlides.length - 1 && nextProj) {
    nextLbl.textContent = 'Siguiente proyecto';
    nextLbl.classList.add('show');
  } else {
    nextLbl.textContent = '';
    nextLbl.classList.remove('show');
  }

  // Prev label: "Proyecto anterior" on first slide if there's a prev project
  if (i === 0 && prevProj) {
    prevLbl.textContent = 'Proyecto anterior';
    prevLbl.classList.add('show');
  } else {
    prevLbl.textContent = '';
    prevLbl.classList.remove('show');
  }

  // Hide/show arrow visibility
  prevBtn.style.display = (i === 0 && !prevProj) ? 'none' : 'flex';
  nextBtn.style.display = (i === allSlides.length - 1 && !nextProj) ? 'none' : 'flex';
}

function prev() {
  if (current > 0) {
    current--; showSlide(current);
  } else if (prevProj) {
    window.location.href = `proyecto.html?p=${prevProj.key}`;
  }
}

function next() {
  if (current < allSlides.length - 1) {
    current++; showSlide(current);
  } else if (nextProj) {
    window.location.href = `proyecto.html?p=${nextProj.key}`;
  }
}

showSlide(0);

/* Keyboard navigation */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next();
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   prev();
  if (e.key === 'Escape') {
    if (document.fullscreenElement) document.exitFullscreen();
    else window.location.href = 'proyectos.html';
  }
});

/* Touch swipe */
let tx = 0;
viewer.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, {passive:true});
viewer.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) < 40) return;
  if (dx < 0) next(); else prev();
});

/* ─── UI auto-hide ─── */
const uiEl = document.getElementById('ui');
let hideTimer;

function showUI() {
  uiEl.classList.add('visible');
  document.body.style.cursor = '';
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => {
    uiEl.classList.remove('visible');
    document.body.style.cursor = 'none';
  }, 2500);
}

document.addEventListener('mousemove', showUI);
document.addEventListener('touchstart', showUI, {passive:true});
showUI();

/* ─── Fullscreen ─── */
const enterFsBtn = document.getElementById('enterFsBtn');
const exitFsBtn  = document.getElementById('exitFsBtn');

function enterFS() {
  document.documentElement.requestFullscreen().catch(() => {});
}
function exitFS() {
  document.exitFullscreen();
}

document.addEventListener('fullscreenchange', () => {
  const inFS = !!document.fullscreenElement;
  enterFsBtn.style.display = inFS ? 'none'   : 'inline-flex';
  exitFsBtn.style.display  = inFS ? 'inline-flex' : 'none';
});

/* ─── Auto-enter fullscreen on desktop load ─── */
const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
if (!isMobile) {
  /* Request fullscreen after a tiny delay (browsers require user gesture;
     we piggyback on the navigation click that brought us here) */
  setTimeout(() => {
    document.documentElement.requestFullscreen().catch(() => {});
  }, 300);
}

/* ─── Mobile flip logic ─── */
const flipPrompt = document.getElementById('flip-prompt');
const phase1     = document.getElementById('flip-phase1');
const phase2     = document.getElementById('flip-phase2');

/* When device rotates to landscape: switch to phase 2 (show "Comenzar") */
function onOrientationChange() {
  if (window.matchMedia('(orientation:landscape)').matches && flipPrompt.style.display !== 'none') {
    phase1.style.display = 'none';
    phase2.style.display = 'flex';
  }
}

window.addEventListener('orientationchange', () => setTimeout(onOrientationChange, 250));
screen.orientation?.addEventListener('change', () => setTimeout(onOrientationChange, 250));

function startPresentation() {
  /* Hide prompt, show viewer */
  flipPrompt.style.display = 'none';
  document.getElementById('viewer').style.display = 'flex';
  document.getElementById('ui').style.display     = 'block';
  /* Try fullscreen + lock landscape */
  document.documentElement.requestFullscreen().then(() => {
    screen.orientation?.lock('landscape').catch(() => {});
  }).catch(() => {});
  showUI();
}

function skipToViewer() {
  flipPrompt.style.display = 'none';
  document.getElementById('viewer').style.display = 'flex';
  document.getElementById('ui').style.display     = 'block';
  showUI();
}
</script>
</body>
</html>
