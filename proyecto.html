<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Proyecto — Cristóbal Ogrodnik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,600;0,700;0,800;1,300;1,800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
html, body { width:100%; height:100%; overflow:hidden; font-family:'Montserrat',sans-serif; background:#000; color:#fff; }

/* ─── VIEWER ─── */
#viewer {
  position:fixed; inset:0; background:#000;
  display:flex; align-items:center; justify-content:center;
}
.slide {
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  opacity:0; transition:opacity .35s ease;
}
.slide.active { opacity:1; z-index:1; }
.slide img { width:100%; height:100%; object-fit:contain; display:block; }

/* ─── LOADING OVERLAY ─── */
#loading {
  position:fixed; inset:0; z-index:50;
  background:#000;
  display:none;
  flex-direction:column;
  align-items:center; justify-content:center;
  gap:6px;
  opacity:0;
  transition:opacity .5s ease;
}
#loading.show { display:flex; }
#loading.fade { opacity:1; }

.ld-direction {
  font-size:11px;
  font-weight:300;
  letter-spacing:0.28em;
  text-transform:uppercase;
  color:rgba(255,255,255,0.4);
  margin-bottom:10px;
}
.ld-title {
  font-size:clamp(26px,5vw,54px);
  font-weight:800;
  font-style:italic;
  letter-spacing:-0.01em;
  color:#fff;
  text-transform:uppercase;
  margin-bottom:18px;
}
.ld-dots {
  font-size:20px;
  font-weight:300;
  letter-spacing:0.4em;
  color:rgba(255,255,255,0.45);
  min-width:3ch; /* prevents layout shift */
  text-align:left;
}

/* ─── UI OVERLAY ─── */
#ui {
  position:fixed; inset:0; z-index:10;
  pointer-events:none; opacity:0; transition:opacity .3s ease;
}
#ui.visible { opacity:1; pointer-events:all; }

#topbar {
  position:absolute; top:0; left:0; right:0;
  padding:20px 28px;
  display:flex; align-items:center; justify-content:space-between;
  background:linear-gradient(to bottom, rgba(0,0,0,0.75) 0%, transparent 100%);
}
.proj-title { font-size:12px; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; color:rgba(255,255,255,0.85); }
.topbar-right { display:flex; gap:10px; }

.ui-btn {
  display:inline-flex; align-items:center; gap:7px;
  background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25);
  color:#fff; font-family:'Montserrat',sans-serif; font-size:11px; font-weight:600;
  letter-spacing:0.07em; padding:8px 16px; border-radius:4px;
  cursor:pointer; text-decoration:none; white-space:nowrap; transition:background .2s;
}
.ui-btn:hover { background:rgba(255,255,255,0.24); }
.ui-btn svg   { width:13px; height:13px; flex-shrink:0; }

#bottombar {
  position:absolute; bottom:0; left:0; right:0;
  padding:20px 28px;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(to top, rgba(0,0,0,0.75) 0%, transparent 100%);
}
.page-counter { font-size:12px; font-weight:600; letter-spacing:0.2em; color:rgba(255,255,255,0.6); }
.page-counter .cur { color:#fff; font-weight:800; }

.nav-arrow {
  position:absolute; top:50%; transform:translateY(-50%);
  display:flex; flex-direction:column; align-items:center; gap:8px;
  cursor:pointer; background:none; border:none; color:#fff; padding:12px; z-index:12;
}
.nav-arrow.left  { left:16px; }
.nav-arrow.right { right:16px; }
.arrow-circle {
  width:52px; height:52px; border-radius:50%;
  background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.28);
  display:flex; align-items:center; justify-content:center;
  transition:background .2s, transform .15s;
}
.nav-arrow:hover .arrow-circle { background:rgba(255,255,255,0.25); transform:scale(1.06); }
.arrow-circle svg { width:20px; height:20px; }
.arrow-label {
  font-size:9px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase;
  color:rgba(255,255,255,0.7); text-align:center; max-width:90px; line-height:1.3;
  opacity:0; transition:opacity .3s;
}
.arrow-label.show { opacity:1; }

/* ─── FLIP PROMPT ─── */
#flip-prompt {
  position:fixed; inset:0; z-index:100; background:#000;
  display:none; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:40px 24px;
}
@media (max-width:900px) and (orientation:portrait) {
  #flip-prompt { display:flex; }
  #viewer, #ui { display:none; }
}
@media (max-width:900px) and (orientation:landscape) {
  #flip-prompt { display:none !important; }
  #viewer { display:flex; }
  #ui     { display:block; }
}
#flip-phase1 { display:flex; flex-direction:column; align-items:center; }
#flip-phase2 { display:none; flex-direction:column; align-items:center; gap:16px; }
.phone-anim {
  width:64px; height:106px; border:3px solid rgba(255,255,255,0.9); border-radius:10px;
  position:relative; margin-bottom:32px; animation:doFlip 2s ease-in-out infinite;
}
.phone-anim::before { content:''; position:absolute; top:7px; left:50%; transform:translateX(-50%); width:24px; height:3px; background:rgba(255,255,255,0.35); border-radius:2px; }
.phone-anim::after  { content:''; position:absolute; bottom:6px; left:50%; transform:translateX(-50%); width:14px; height:14px; border:2px solid rgba(255,255,255,0.35); border-radius:50%; }
@keyframes doFlip { 0%,30%{transform:rotate(0deg)} 70%,100%{transform:rotate(-90deg)} }
.flip-title { font-size:17px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:10px; }
.flip-msg   { font-size:12px; font-weight:300; color:rgba(255,255,255,0.55); line-height:1.7; max-width:250px; margin-bottom:24px; }
.start-btn  { background:#fff; color:#000; border:none; padding:14px 36px; font-family:'Montserrat',sans-serif; font-size:13px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; border-radius:4px; cursor:pointer; }
.skip-btn   { background:none; border:1px solid rgba(255,255,255,0.3); color:rgba(255,255,255,0.6); padding:10px 24px; font-family:'Montserrat',sans-serif; font-size:11px; border-radius:4px; cursor:pointer; }
</style>
</head>
<body>

<div id="flip-prompt">
  <div id="flip-phase1">
    <div class="phone-anim"></div>
    <h2 class="flip-title">Gira tu teléfono</h2>
    <p class="flip-msg">Para ver el proyecto, gira tu dispositivo a modo horizontal.</p>
  </div>
  <div id="flip-phase2">
    <h2 class="flip-title">¡Listo!</h2>
    <p class="flip-msg">Presiona comenzar para entrar al modo presentación.</p>
    <button class="start-btn" onclick="startPresentation()">Comenzar</button>
    <button class="skip-btn"  onclick="skipToViewer()">Continuar sin rotar</button>
  </div>
</div>

<div id="viewer"></div>

<!-- Loading overlay: direction label + project title + slow dots -->
<div id="loading">
  <span class="ld-direction" id="ldDirection">Siguiente proyecto</span>
  <span class="ld-title"     id="ldTitle">—</span>
  <span class="ld-dots"      id="ldDots">.</span>
</div>

<div id="ui">
  <div id="topbar">
    <div class="proj-title" id="projTitle">PROYECTO</div>
    <div class="topbar-right">
      <button class="ui-btn" id="exitFsBtn" style="display:none" onclick="exitFS()">
        <svg viewBox="0 0 14 14" fill="none"><path d="M5 2H2v3M9 2h3v3M2 9v3h3M12 9v3h-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Salir de presentación
      </button>
      <button class="ui-btn" id="enterFsBtn" onclick="enterFS()">
        <svg viewBox="0 0 14 14" fill="none"><path d="M2 5V2h3M9 2h3v3M2 9v3h3M12 9v3h-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Modo presentación
      </button>
      <a href="proyectos.html" class="ui-btn">
        <svg viewBox="0 0 12 12" fill="none"><path d="M2 2l8 8M2 10L10 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Cerrar
      </a>
    </div>
  </div>

  <button class="nav-arrow left"  id="prevBtn" onclick="prev()">
    <div class="arrow-circle"><svg viewBox="0 0 20 20" fill="none"><path d="M13 4L7 10L13 16" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <span class="arrow-label" id="prevLabel"></span>
  </button>

  <button class="nav-arrow right" id="nextBtn" onclick="next()">
    <div class="arrow-circle"><svg viewBox="0 0 20 20" fill="none"><path d="M7 4L13 10L7 16" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <span class="arrow-label" id="nextLabel"></span>
  </button>

  <div id="bottombar">
    <div class="page-counter">
      <span class="cur" id="curPage">1</span> / <span id="totPage">1</span>
    </div>
  </div>
</div>

<script>
const PROJECTS = [
  { key:'muds',      title:'MUDS',                 slides:['proyectos-img/MUDS_1.jpg','proyectos-img/MUDS_2.jpg'] },
  { key:'neast',     title:'by Neast',              slides:['proyectos-img/Neast_1.jpg','proyectos-img/Neast_2.jpg'] },
  { key:'lontra',    title:'Lontra Platform',       slides:['proyectos-img/Lontra_Platform_01.jpg','proyectos-img/Lontra_Platform_02.jpg','proyectos-img/Lontra_Platform_03.jpg'] },
  { key:'konatec',   title:'Konatec',               slides:['proyectos-img/Konatec_01.jpg','proyectos-img/Konatec_02.jpg'] },
  { key:'copihue',   title:'Espacio Copihue',       slides:['proyectos-img/Espacio_Copihue_01.jpg','proyectos-img/Espacio_Copihue_02.jpg'] },
  { key:'cambridge', title:'Cambridge & José Cruz', slides:['proyectos-img/Cambridge_01.jpg','proyectos-img/Cambridge_03.jpg','proyectos-img/Cambridge_04.jpg'] },
  { key:'refugio',   title:'Refugio Prisma',        slides:['proyectos-img/Refugio_Prisma_01.jpg','proyectos-img/Refugio_Prisma_02.jpg'] }
];

let projIdx = 0;
let current = 0;

const viewer     = document.getElementById('viewer');
const loading    = document.getElementById('loading');
const ldDir      = document.getElementById('ldDirection');
const ldTitle    = document.getElementById('ldTitle');
const ldDots     = document.getElementById('ldDots');
const titleEl    = document.getElementById('projTitle');
const curPageEl  = document.getElementById('curPage');
const totPageEl  = document.getElementById('totPage');
const prevBtn    = document.getElementById('prevBtn');
const nextBtn    = document.getElementById('nextBtn');
const prevLbl    = document.getElementById('prevLabel');
const nextLbl    = document.getElementById('nextLabel');
const enterFsBtn = document.getElementById('enterFsBtn');
const exitFsBtn  = document.getElementById('exitFsBtn');
const uiEl       = document.getElementById('ui');

/* ─── Load project in-page ─── */
function loadProject(idx, startSlide) {
  const proj  = PROJECTS[idx];
  if (!proj) return;
  projIdx = idx;
  current = startSlide || 0;

  titleEl.textContent    = proj.title;
  document.title         = proj.title + ' — Cristóbal Ogrodnik';
  totPageEl.textContent  = proj.slides.length;
  history.replaceState(null, '', `proyecto.html?p=${proj.key}`);

  viewer.innerHTML = '';
  proj.slides.forEach((src, i) => {
    const div = document.createElement('div');
    div.className = 'slide' + (i === current ? ' active' : '');
    const img = document.createElement('img');
    img.src = src;
    img.alt = proj.title + ' ' + (i + 1);
    div.appendChild(img);
    viewer.appendChild(div);
  });

  updateUI();
}

function updateUI() {
  const slides = viewer.querySelectorAll('.slide');
  const total  = slides.length;
  curPageEl.textContent = current + 1;

  /* Right arrow label */
  if (current === total - 1 && projIdx < PROJECTS.length - 1) {
    nextLbl.textContent = 'Siguiente proyecto';
    nextLbl.classList.add('show');
  } else {
    nextLbl.textContent = '';
    nextLbl.classList.remove('show');
  }

  /* Left arrow label */
  if (current === 0 && projIdx > 0) {
    prevLbl.textContent = 'Proyecto anterior';
    prevLbl.classList.add('show');
  } else {
    prevLbl.textContent = '';
    prevLbl.classList.remove('show');
  }

  prevBtn.style.display = (current === 0 && projIdx === 0)                          ? 'none' : 'flex';
  nextBtn.style.display = (current === total - 1 && projIdx === PROJECTS.length - 1) ? 'none' : 'flex';
}

/* ─── Loading animation: slow dots, 600ms per step ─── */
let dotsTimer = null;

function showLoading(direction, projTitle) {
  ldDir.textContent   = direction;  /* "Siguiente proyecto" | "Proyecto anterior" */
  ldTitle.textContent = projTitle;
  ldDots.textContent  = '.';

  loading.classList.add('show');
  /* Fade in */
  requestAnimationFrame(() => {
    requestAnimationFrame(() => loading.classList.add('fade'));
  });

  let step = 1;
  dotsTimer = setInterval(() => {
    step = (step % 3) + 1;
    ldDots.textContent = '.'.repeat(step);
  }, 600); /* 600ms per dot — slow and readable */
}

function hideLoading() {
  clearInterval(dotsTimer);
  loading.classList.remove('fade');
  /* Wait for fade-out then hide */
  setTimeout(() => loading.classList.remove('show'), 500);
}

/* ─── Navigate to another project ─── */
const TRANSITION_MS = 2200; /* 3 dots × 600ms + fade in/out ≈ 2.2s */

function goToProject(idx, startSlide, direction) {
  const target = PROJECTS[idx];
  if (!target) return;
  showLoading(direction, target.title);
  setTimeout(() => {
    loadProject(idx, startSlide);
    hideLoading();
    showUI();
  }, TRANSITION_MS);
}

function next() {
  const slides = viewer.querySelectorAll('.slide');
  if (current < slides.length - 1) {
    slides[current].classList.remove('active');
    current++;
    slides[current].classList.add('active');
    updateUI();
  } else if (projIdx < PROJECTS.length - 1) {
    goToProject(projIdx + 1, 0, 'Siguiente proyecto');
  }
}

function prev() {
  const slides = viewer.querySelectorAll('.slide');
  if (current > 0) {
    slides[current].classList.remove('active');
    current--;
    slides[current].classList.add('active');
    updateUI();
  } else if (projIdx > 0) {
    const prevP = PROJECTS[projIdx - 1];
    goToProject(projIdx - 1, prevP.slides.length - 1, 'Proyecto anterior');
  }
}

/* ─── Keyboard ─── */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next();
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   prev();
  if (e.key === 'Escape') {
    if (document.fullscreenElement) document.exitFullscreen();
    else window.location.href = 'proyectos.html';
  }
});

/* ─── Touch swipe ─── */
let tx = 0;
viewer.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, {passive:true});
viewer.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) < 40) return;
  if (dx < 0) next(); else prev();
});

/* ─── UI auto-hide ─── */
let hideTimer;
function showUI() {
  uiEl.classList.add('visible');
  document.body.style.cursor = '';
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => {
    uiEl.classList.remove('visible');
    document.body.style.cursor = 'none';
  }, 2500);
}
document.addEventListener('mousemove', showUI);
document.addEventListener('touchstart', showUI, {passive:true});

/* ─── Fullscreen ─── */
function enterFS() { document.documentElement.requestFullscreen().catch(() => {}); }
function exitFS()  { document.exitFullscreen(); }
document.addEventListener('fullscreenchange', () => {
  const fs = !!document.fullscreenElement;
  enterFsBtn.style.display = fs ? 'none'        : 'inline-flex';
  exitFsBtn.style.display  = fs ? 'inline-flex' : 'none';
});

/* Auto fullscreen on desktop */
const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
if (!isMobile) {
  setTimeout(() => document.documentElement.requestFullscreen().catch(() => {}), 300);
}

/* ─── Init ─── */
const params = new URLSearchParams(window.location.search);
const key    = params.get('p') || 'muds';
const idx    = Math.max(0, PROJECTS.findIndex(p => p.key === key));
loadProject(idx, 0);
showUI();

/* ─── Mobile flip ─── */
function onOrientationChange() {
  if (window.matchMedia('(orientation:landscape)').matches) {
    const fp = document.getElementById('flip-prompt');
    if (getComputedStyle(fp).display !== 'none') {
      document.getElementById('flip-phase1').style.display = 'none';
      document.getElementById('flip-phase2').style.display = 'flex';
    }
  }
}
window.addEventListener('orientationchange', () => setTimeout(onOrientationChange, 250));
screen.orientation?.addEventListener('change', () => setTimeout(onOrientationChange, 250));

function startPresentation() {
  document.getElementById('flip-prompt').style.display = 'none';
  viewer.style.display = 'flex';
  uiEl.style.display   = 'block';
  document.documentElement.requestFullscreen()
    .then(() => screen.orientation?.lock('landscape').catch(() => {}))
    .catch(() => {});
  showUI();
}
function skipToViewer() {
  document.getElementById('flip-prompt').style.display = 'none';
  viewer.style.display = 'flex';
  uiEl.style.display   = 'block';
  showUI();
}
</script>
</body>
</html>
