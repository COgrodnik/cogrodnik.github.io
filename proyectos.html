<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyectos — Cristóbal Ogrodnik</title>
<meta name="description" content="Proyectos de diseño de producto, fabricación digital y emprendimiento de Cristóbal Ogrodnik.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a1a1a'/%3E%3Ctext x='32' y='43' font-family='Arial,Helvetica,sans-serif' font-size='28' font-weight='800' text-anchor='middle' fill='white'%3ECO%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,600;0,700;0,800&family=Shadows+Into+Light&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --dark:#1a1a1a; --white:#fff; --gray:#888; --btn-dark:#2d2d2d; --btn-cream:#d9d9d9; }
body { font-family:'Montserrat',sans-serif; background:#fff; color:var(--dark); min-height:100vh; padding-bottom:60px; }

.top-nav { display:flex; align-items:center; justify-content:space-between; padding:36px 8%; flex-wrap:wrap; gap:16px; }
.page-title { font-family:'Shadows Into Light',cursive; font-size:clamp(52px,7vw,82px); font-weight: 400; color:var(--dark); line-height:1; display:inline-block; transform:rotate(-2deg); }
.nav-buttons { display:flex; gap:12px; }
.btn { display:inline-flex; align-items:center; justify-content:center; padding:12px 32px; font-family:'Montserrat',sans-serif; font-size:13px; font-weight:600; letter-spacing:0.04em; border-radius:999px; text-decoration:none; border:none; cursor:pointer; transition:transform .15s,opacity .15s; }
.btn:hover { transform:translateY(-1px); opacity:.85; }
.btn-dark { background:var(--btn-dark); color:#fff; }
.btn-light { background:#d9d9d9; color:#555; font-weight:600; }

/* ═══ BURBUJAS (compartido) ═══ */
.pill-name { font-size:12px; font-weight:700; color:var(--dark); margin-bottom:3px; overflow-wrap:anywhere; }
.pill-desc { font-size:10px; color:var(--gray); line-height:1.5; overflow-wrap:anywhere; }
.pill-placeholder { width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:linear-gradient(160deg,#888 0%,#444 100%); color:rgba(255,255,255,0.55); font-size:10px; font-weight:600; text-align:center; padding:12px; }

/* ═══ DOTS (compartido): máximo 5 visibles; la ventana se desplaza y los extremos se achican si hay más ═══ */
.m-dots { overflow:hidden; margin:2px auto 0; }
.m-dots-track { display:flex; transition:transform .35s cubic-bezier(.22,.8,.3,1); }
.m-dot { flex:0 0 16px; height:16px; padding:0; border:0; background:none; display:flex; align-items:center; justify-content:center; cursor:pointer; -webkit-tap-highlight-color:transparent; }
.m-dot::after { content:''; width:7px; height:7px; border-radius:50%; background:rgba(0,0,0,0.22); transition:transform .3s ease, background .3s ease, opacity .3s ease; }
.m-dot:hover::after { background:rgba(0,0,0,0.4); }
.m-dot.active::after { background:var(--dark); transform:scale(1.3); }
.m-dot.edge::after   { transform:scale(.6); }
.m-dot.out::after    { transform:scale(0); opacity:0; }

/* ═══ DESKTOP: carrusel infinito de 7 posiciones (5 nítidas + 2 asomadas y difuminadas en los extremos) ═══ */
.desktop-projects { padding:0 6% 40px; }
.d-stage {
  position:relative; width:100%;
  --w:180px; --lh:92px;                         /* ancho de burbuja y alto de la zona de etiquetas (los calcula el JS) */
  height:calc(var(--w) / 0.44 + var(--lh) * 2 + 44px);
  overflow-x:hidden; overflow-x:clip;           /* solo se recorta en horizontal: la sombra no se corta */
  touch-action:pan-y; overscroll-behavior-x:contain;
  user-select:none; -webkit-user-select:none;
  cursor:grab; outline:none;
}
.d-stage.dragging { cursor:grabbing; }
.d-stage.dragging .d-slide, .d-stage.no-anim .d-slide { transition:none; }
.d-slide {
  position:absolute; top:0; left:50%; width:var(--w); margin-left:calc(var(--w) / -2);
  display:grid; grid-template-rows:var(--lh) auto var(--lh);
  transition:transform .55s cubic-bezier(.22,.8,.3,1), opacity .55s ease, filter .55s ease;
  will-change:transform, opacity, filter;
}
.d-label { padding:0 6px; }
.d-label.top    { align-self:end;   padding-bottom:14px; }   /* etiquetas arriba o abajo, alternadas */
.d-label.bottom { align-self:start; padding-top:14px; }

.pill-card {
  display:block; border-radius:200px; overflow:hidden; cursor:pointer; text-decoration:none;
  background:#e0e0e0; width:100%; aspect-ratio:0.44; position:relative;
  border:5px solid #ffffff;
  box-shadow:0 8px 28px rgba(0,0,0,0.18), 0 2px 8px rgba(0,0,0,0.10);
  transition:transform .35s ease, box-shadow .3s ease;
  -webkit-user-drag:none;
}
.pill-card:hover { transform:translateY(-8px) scale(1.02); box-shadow:0 28px 52px rgba(0,0,0,0.22), 0 4px 12px rgba(0,0,0,0.12); }
.pill-card img { width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; -webkit-user-drag:none; }
.pill-card::after {
  content:attr(data-name);
  position:absolute; inset:0;
  background:rgba(0,0,0,0.52);
  display:flex; align-items:center; justify-content:center;
  font-size:10px; font-weight:700; letter-spacing:0.1em;
  color:#fff; opacity:0; transition:opacity .25s;
  padding:12px; text-align:center; border-radius:200px; text-transform:uppercase;
}
.pill-card:hover::after { opacity:1; }
.d-stage.dragging .pill-card:hover { transform:none; box-shadow:0 8px 28px rgba(0,0,0,0.18), 0 2px 8px rgba(0,0,0,0.10); }
.d-stage.dragging .pill-card::after { opacity:0; }

/* Entrada escalonada al cargar */
@keyframes pillIn { from { opacity:0; transform:translateY(28px); } }
.d-stage.intro .pill-card { animation:pillIn .6s ease backwards; animation-delay:calc(var(--k, 0) * .08s); }

.d-dots { margin-top:6px; }

/* ═══ MOBILE CAROUSEL (infinito, con peek) ═══ */
.mobile-projects { display:none; padding:0 0 60px; }

/* El stage tiene alto fijo con espacio de sobra arriba/abajo: así la sombra de la burbuja no se corta.
   Solo se recorta en horizontal (los vecinos que salen de pantalla). */
.mobile-stage {
  position:relative; height:570px;
  overflow-x:hidden; overflow-x:clip;
  touch-action:pan-y;               /* scroll vertical normal, el horizontal lo maneja el carrusel */
  user-select:none; -webkit-user-select:none;
  cursor:grab; outline:none;
}
.mobile-stage.dragging { cursor:grabbing; }
.mobile-stage.dragging .m-slide { transition:none; }

.m-slide {
  position:absolute; top:10px; left:50%; width:280px; margin-left:-140px;
  display:flex; flex-direction:column; align-items:center;
  transition: transform .5s cubic-bezier(.22,.8,.3,1), opacity .5s ease, filter .5s ease;
  will-change: transform, opacity, filter;
}
.m-label { width:100%; height:72px; padding:0 10px; margin-bottom:16px; text-align:center; transition:opacity .3s ease; }
.m-label .pill-name { font-size:14px; margin-bottom:4px; }
.m-label .pill-desc { font-size:11px; }

.mobile-pill {
  width:180px; aspect-ratio:0.44; border-radius:200px; overflow:hidden; display:block;
  text-decoration:none; background:#e0e0e0; border:5px solid #ffffff;
  box-shadow:0 8px 28px rgba(0,0,0,0.18), 0 2px 8px rgba(0,0,0,0.10);
  -webkit-user-drag:none;
}
.mobile-pill img { width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; -webkit-user-drag:none; }
#mDots { width:80px; }

@media (max-width:700px) {
  .desktop-projects { display:none; }
  .mobile-projects  { display:block; }
  .top-nav { padding:24px 6%; }
}

/* ─── FOOTER ─── */
#site-footer {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 32px;
  padding: 28px 52px 32px;
  background: transparent;
  border-top: 1px solid rgba(0,0,0,0.08);
  margin-top: 40px;
}
.footer-link {
  display: inline-flex; align-items: center; gap: 7px;
  font-family: 'Montserrat', sans-serif;
  font-size: 10px; font-weight: 600; letter-spacing: 0.12em;
  text-transform: uppercase; color: #444; text-decoration: none;
  transition: color .2s ease, transform .2s ease;
}
.footer-link:hover { color: #000; transform: translateY(-2px); }
.footer-link svg { width: 20px; height: 20px; flex-shrink: 0; }
.footer-divider { width: 1px; height: 16px; background: rgba(0,0,0,0.15); }

</style>
</head>
<body>

<nav class="top-nav">
  <h1 class="page-title">¡PROYECTOS!</h1>
  <div class="nav-buttons">
    <a href="resumen.html" class="btn btn-dark">Resumen</a>
    <a href="index.html" class="btn btn-light">Inicio</a>
  </div>
</nav>

<!-- ═══ DESKTOP: carrusel infinito, 7 posiciones (se genera desde projects.js) ═══ -->
<div class="desktop-projects">
  <div class="d-stage intro" id="dStage" tabindex="0" role="region" aria-roledescription="carrusel" aria-label="Proyectos"></div>
  <div class="m-dots d-dots" id="dDots"></div>
</div>

<!-- ═══ MOBILE: carrusel infinito (se genera desde projects.js) ═══ -->
<div class="mobile-projects">
  <div class="mobile-stage" id="mStage" tabindex="0" role="region" aria-roledescription="carrusel" aria-label="Proyectos"></div>
  <div class="m-dots" id="mDots"></div>
</div>

<script src="projects.js"></script>
<script>
/* ═══════════════════════ Utilidades compartidas ═══════════════════════ */

/* Burbuja (link a la imagen de portada). Si la portada falta usa la 1ª imagen del proyecto; si tampoco, un recuadro con el nombre. */
function buildPill(p, className, withOverlay) {
  const a = document.createElement('a');
  a.href = 'proyecto.html?p=' + encodeURIComponent(p.key);
  a.className = className;
  a.draggable = false;
  if (withOverlay) a.setAttribute('data-name', p.title);
  const img = document.createElement('img');
  img.alt = p.title; img.draggable = false;
  let tried = 0;
  img.onerror = () => {
    if (tried++ === 0 && p.slides && p.slides[0]) { img.src = p.slides[0]; return; }
    const ph = document.createElement('div');
    ph.className = 'pill-placeholder'; ph.textContent = p.title;
    img.replaceWith(ph);
  };
  img.src = p.cover;
  a.appendChild(img);
  return a;
}
function buildLabel(p, cls) {
  const d = document.createElement('div');
  d.className = cls;
  const n = document.createElement('p'); n.className = 'pill-name'; n.textContent = p.title;
  const t = document.createElement('p'); t.className = 'pill-desc'; t.textContent = p.desc || '';
  d.append(n, t);
  return d;
}

/* Dots: máx. 5 visibles, la ventana se desplaza; devuelve la función que marca el activo */
function createDots(dotsEl, N, onPick) {
  const MAXDOTS = 5, vis = Math.min(N, MAXDOTS);
  const track = document.createElement('div');
  track.className = 'm-dots-track';
  dotsEl.appendChild(track);
  dotsEl.style.width = (vis * 16) + 'px';
  const dots = Array.from({length: N}, (_, i) => {
    const d = document.createElement('button');
    d.className = 'm-dot';
    d.setAttribute('aria-label', 'Ir al proyecto ' + (i + 1));
    d.addEventListener('click', () => onPick(i));
    track.appendChild(d);
    return d;
  });
  return function update(active) {
    const ws = Math.max(0, Math.min(N - vis, active - Math.floor(vis / 2)));
    track.style.transform = 'translateX(' + (-ws * 16) + 'px)';
    dots.forEach((d, i) => {
      const inWin = i >= ws && i < ws + vis;
      d.classList.toggle('active', i === active);
      d.classList.toggle('out', !inWin);
      /* extremo de la ventana con más proyectos más allá => punto chico */
      d.classList.toggle('edge', inWin && i !== active &&
        ((i === ws && ws > 0) || (i === ws + vis - 1 && ws + vis < N)));
    });
  };
}

/* ═══════════════════════ DESKTOP: carrusel infinito de 7 posiciones ═══════════════════════ */
(() => {
  const stage = document.getElementById('dStage');
  const N = PROJECTS.length;

  /* Se ven 7 posiciones (5 nítidas + 2 asomadas). Para que las etiquetas alternen arriba/abajo también en la
     "costura" del loop, la cantidad de burbujas del anillo debe ser par y ≥ 8. Si no lo es, se repite la lista
     (los dots siguen siendo N). */
  let reps = Math.max(1, Math.ceil(8 / N));
  if ((N * reps) % 2) reps++;
  const L = N * reps;

  const slides = Array.from({length: L}, (_, i) => {
    const p = PROJECTS[i % N];
    const side = i % 2 === 0 ? 'top' : 'bottom';
    const el = document.createElement('div');
    el.className = 'd-slide';
    const top = document.createElement('div');    top.className = 'd-label top';
    const bottom = document.createElement('div'); bottom.className = 'd-label bottom';
    const lab = buildLabel(p, 'd-label-inner');
    (side === 'top' ? top : bottom).append(...lab.childNodes);
    el.append(top, buildPill(p, 'pill-card', true), bottom);
    stage.appendChild(el);
    return el;
  });

  let idx = 0, STEP = 220, dragging = false, moved = false, startX = 0, startT = 0;
  const prevOff = slides.map(() => null);
  const updateDots = createDots(document.getElementById('dDots'), N, pickItem);

  function circ(i) {                       /* distancia circular de cada burbuja a la activa */
    let o = ((i - idx) % L + L) % L;
    if (o > L / 2) o -= L;
    return o;
  }

  function render(frac) {
    slides.forEach((el, i) => {
      const off = circ(i);
      const wrapped = prevOff[i] !== null && Math.abs(off - prevOff[i]) > L / 2;   /* da la vuelta: se reubica sin animar (invisible) */
      prevOff[i] = off;
      if (wrapped) el.style.transition = 'none';
      const pos = off + frac, a = Math.abs(pos);
      /* 5 centrales (a ≤ 2): nítidas. Extremos (a ≈ 3): asomadas, difuminadas y atenuadas. Más allá: invisibles. */
      let opacity, blur, scale;
      if (a <= 2)      { opacity = 1;                           blur = 0;             scale = 1; }
      else if (a <= 3) { opacity = 1 - 0.55 * (a - 2);          blur = 3 * (a - 2);   scale = 1 - 0.05 * (a - 2); }
      else             { opacity = Math.max(0, 0.45 * (4 - a)); blur = 3;             scale = 0.95; }
      el.style.transform     = 'translate3d(' + (pos * STEP).toFixed(1) + 'px,0,0) scale(' + scale.toFixed(3) + ')';
      el.style.opacity       = opacity.toFixed(3);
      el.style.filter        = blur > 0.05 ? 'blur(' + blur.toFixed(2) + 'px)' : 'none';
      el.style.zIndex        = String(100 - Math.round(a * 10));
      el.style.pointerEvents = a < 3.4 ? 'auto' : 'none';
      if (wrapped) { void el.offsetWidth; requestAnimationFrame(() => { el.style.transition = ''; }); }
    });
  }

  function go(i) {
    idx = ((i % L) + L) % L;
    render(0);
    updateDots(idx % N);
  }
  function pickItem(n) {                   /* desde un dot: ir por el camino más corto */
    let diff = ((n - (idx % N)) % N + N) % N;
    if (diff > N / 2) diff -= N;
    go(idx + diff);
  }

  /* Tamaño: la burbuja se adapta al ancho (caben 5 + márgenes) y al alto de la ventana */
  function layout() {
    const cw = stage.clientWidth;
    if (!cw) return;                       /* oculto (versión celular) */
    let W = Math.min(cw / 7.7, Math.max(140, (window.innerHeight - 380) * 0.44));
    W = Math.max(70, Math.min(230, W));
    /* Separación entre burbujas: mínimo 1.1×ancho; si sobra espacio (pantallas anchas pero bajas) se reparten hasta 1.45× */
    STEP = Math.max(W * 1.1, Math.min(W * 1.45, (cw - W) / 6.2));
    const LH = Math.min(140, Math.max(84, Math.round(14000 / W)));
    stage.style.setProperty('--w', W.toFixed(1) + 'px');
    stage.style.setProperty('--lh', LH + 'px');
    stage.classList.add('no-anim');
    render(0);
    requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.remove('no-anim')));
  }
  window.addEventListener('resize', layout);

  /* Arrastre con mouse o dedo */
  stage.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    dragging = true; moved = false;
    startX = e.clientX; startT = performance.now();
    window.addEventListener('pointermove',   onMove);
    window.addEventListener('pointerup',     onUp);
    window.addEventListener('pointercancel', onCancel);
  });
  function onMove(e) {
    const dx = e.clientX - startX;
    if (!moved && Math.abs(dx) > 6) { moved = true; stage.classList.add('dragging'); }
    if (moved) render(Math.max(-1, Math.min(1, dx / STEP)));
  }
  function endDrag() {
    dragging = false;
    stage.classList.remove('dragging');
    window.removeEventListener('pointermove',   onMove);
    window.removeEventListener('pointerup',     onUp);
    window.removeEventListener('pointercancel', onCancel);
    setTimeout(() => { moved = false; }, 0);          /* después del click que dispara el navegador */
  }
  function onUp(e) {
    const dx = e.clientX - startX;
    const v  = Math.abs(dx) / Math.max(1, performance.now() - startT);
    const swiped = moved && (Math.abs(dx) > STEP * 0.22 || v > 0.35);
    endDrag();
    if (swiped) go(dx < 0 ? idx + 1 : idx - 1); else render(0);
  }
  function onCancel() { endDrag(); render(0); }

  /* Click: las 5 nítidas abren el proyecto; las 2 asomadas de los extremos (peek) se centran */
  slides.forEach((el, i) => el.addEventListener('click', e => {
    if (moved) { e.preventDefault(); return; }
    const off = circ(i);
    if (Math.abs(off) >= 3) { e.preventDefault(); go(idx + off); }
  }));

  /* Teclado y trackpad (deslizar con dos dedos en horizontal) */
  stage.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') go(idx + 1);
    if (e.key === 'ArrowLeft')  go(idx - 1);
  });
  let wheelAcc = 0, wheelLock = false, wheelTimer = null;
  stage.addEventListener('wheel', e => {
    if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;   /* scroll vertical: normal */
    e.preventDefault();
    if (!wheelLock) {
      wheelAcc += e.deltaX;
      if (Math.abs(wheelAcc) > 50) { go(idx + (wheelAcc > 0 ? 1 : -1)); wheelAcc = 0; wheelLock = true; }
    }
    clearTimeout(wheelTimer);                               /* un gesto = un paso (aunque haya inercia) */
    wheelTimer = setTimeout(() => { wheelLock = false; wheelAcc = 0; }, 140);
  }, {passive:false});

  /* Entrada escalonada: solo las 7 visibles */
  slides.forEach((el, i) => {
    const off = circ(i);
    el.querySelector('.pill-card').style.setProperty('--k', String(Math.abs(off) <= 3 ? off + 3 : 0));
  });
  setTimeout(() => stage.classList.remove('intro'), 1400);

  layout();
  go(0);
})();

/* ═══════════════════════ MOBILE: infinito, peek, swipe + dots ═══════════════════════ */
(() => {
  const stage  = document.getElementById('mStage');
  const N      = PROJECTS.length;
  const STEP   = 165;            /* distancia entre centros de burbujas (px) */

  const slides = PROJECTS.map(p => {
    const el = document.createElement('div');
    el.className = 'm-slide';
    el.append(buildLabel(p, 'm-label'), buildPill(p, 'mobile-pill', false));
    stage.appendChild(el);
    return el;
  });
  const labels = slides.map(el => el.querySelector('.m-label'));
  let idx = 0, dragging = false, moved = false, startX = 0, startT = 0;
  const updateDots = createDots(document.getElementById('mDots'), N, i => go(i));

  /* Distancia circular de cada slide al activo => carrusel infinito */
  function circ(i) {
    let o = ((i - idx) % N + N) % N;
    if (o > N / 2) o -= N;
    return o;
  }

  const prevOff = slides.map(() => null);
  function render(frac) {
    slides.forEach((el, i) => {
      /* Posición real (sin recortar): cada burbuja tiene su propio lugar, así no se encima ninguna al arrastrar */
      const off = circ(i);
      /* Si la burbuja "da la vuelta" al otro extremo, se reubica sin animar (está invisible) */
      const wrapped = prevOff[i] !== null && Math.abs(off - prevOff[i]) > N / 2;
      prevOff[i] = off;
      if (wrapped) el.style.transition = 'none';
      const pos = off + frac;
      const a   = Math.abs(pos);
      const scale   = 1 - 0.16 * Math.min(a, 1.5);
      const opacity = a <= 1 ? 1 - 0.5 * a : Math.max(0, 0.5 - 0.5 * (a - 1));
      const blur    = Math.min(a, 1.2) * 3;
      el.style.transform     = 'translate3d(' + (pos * STEP).toFixed(1) + 'px,0,0) scale(' + scale.toFixed(3) + ')';
      el.style.opacity       = opacity.toFixed(3);
      el.style.filter        = blur > 0.05 ? 'blur(' + blur.toFixed(2) + 'px)' : 'none';
      el.style.zIndex        = String(100 - Math.round(a * 10));
      el.style.pointerEvents = a < 1.6 ? 'auto' : 'none';
      labels[i].style.opacity = Math.max(0, 1 - a * 2).toFixed(3);
      if (wrapped) { void el.offsetWidth; requestAnimationFrame(() => { el.style.transition = ''; }); }
    });
  }

  function go(i) {
    idx = ((i % N) + N) % N;
    render(0);
    updateDots(idx);
  }

  /* Arrastre con el dedo (o mouse) */
  stage.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    dragging = true; moved = false;
    startX = e.clientX; startT = performance.now();
    window.addEventListener('pointermove',  onMove);
    window.addEventListener('pointerup',    onUp);
    window.addEventListener('pointercancel', onCancel);
  });
  function onMove(e) {
    const dx = e.clientX - startX;
    if (!moved && Math.abs(dx) > 6) { moved = true; stage.classList.add('dragging'); }
    if (moved) render(Math.max(-1, Math.min(1, dx / STEP)));
  }
  function endDrag() {
    dragging = false;
    stage.classList.remove('dragging');
    window.removeEventListener('pointermove',  onMove);
    window.removeEventListener('pointerup',    onUp);
    window.removeEventListener('pointercancel', onCancel);
    setTimeout(() => { moved = false; }, 0); /* después del click que dispara el navegador */
  }
  function onUp(e) {
    const dx = e.clientX - startX;
    const v  = Math.abs(dx) / Math.max(1, performance.now() - startT);
    const swiped = moved && (Math.abs(dx) > 45 || v > 0.4);
    endDrag();
    if (swiped) go(dx < 0 ? idx + 1 : idx - 1);
    else render(0);
  }
  function onCancel() { endDrag(); render(0); }   /* p.ej. el navegador tomó el gesto para scroll vertical */

  /* Tocar un vecino lo centra; tocar el central abre el proyecto */
  slides.forEach((el, i) => el.addEventListener('click', e => {
    if (moved) { e.preventDefault(); return; }
    if (circ(i) !== 0) { e.preventDefault(); go(i); }
  }));

  stage.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') go(idx + 1);
    if (e.key === 'ArrowLeft')  go(idx - 1);
  });

  go(0);
})();
</script>
